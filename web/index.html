<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>仍在生成 · AI 时代探索地图</title>
  <!-- SITE_DESCRIPTION -->
  <!-- APP_STYLES -->
</head>
<body>
  <a class="skip-link" href="#main-content">跳到地图内容</a>
  <header class="site-header">
    <a class="brand" href="#view=years" aria-label="仍在生成，返回地图首页">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span>仍在生成<small>AI 时代探索地图</small></span>
    </a>
    <div class="header-tools">
      <label class="background-picker" hidden><span>背景</span>
        <select id="reading-background" autocomplete="off">
          <option value="default">原版浅色</option>
          <option value="paper">胡桃书页</option>
          <option value="grid">深蓝夜读</option>
          <option value="sage">浅绿留白</option>
        </select>
      </label>
      <button type="button" id="guide-toggle" aria-controls="reading-entry" aria-expanded="false" hidden>地图指南</button>
    </div>
  </header>
  <script>
    // 在解析地图数据前恢复底色，回访时可直接看到上次选的背景。
    (() => {
      const picker = document.getElementById('reading-background');
      const key = 'ai-growth-tracking.background';
      try { picker.value = localStorage.getItem(key) || picker.value; } catch {}
      if (picker.selectedIndex < 0) picker.selectedIndex = 0;
      document.documentElement.dataset.background = picker.value;
      picker.parentElement.hidden = false;
      picker.addEventListener('change', () => {
        document.documentElement.dataset.background = picker.value;
        try { localStorage.setItem(key, picker.value); } catch {}
      });
    })();
  </script>
  <nav id="breadcrumbs" class="breadcrumbs" aria-label="当前位置"></nav>
  <main id="main-content" tabindex="-1">
    <div id="reading-entry"></div>
    <div id="app"><p class="empty-state">地图内容尚未载入，请打开构建后的本地页面。</p></div>
  </main>
  <footer class="site-footer"><span id="updated-at">本地内容快照</span><span id="coverage-as-of">资料覆盖截止见各年</span><span>同期并列不表示因果</span></footer>
  <div id="announcer" class="sr-only" role="status" aria-live="polite"></div>
  <noscript><p class="empty-state">探索地图需要启用 JavaScript。原始内容仍可从项目数据文件中读取。</p></noscript>
  <!-- MAP_DATA -->
  <!-- APP_SCRIPT -->
</body>
</html>
